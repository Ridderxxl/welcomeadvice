# Governance: policies, assessments, risks, measures, regulations and review triggers.
# Derived from the Banco Salamanca case. Scenario keys work as in inventory.toml.

# ---------------------------------------------------------------- Policies

[[policies]]
id = "POL-001"
title = "AI Policy"
kind = "Policy"
owner = "Chief Compliance Officer"
version = "1.2"
status = "In force"
effective = -126
next_review = 239
systems = ["AIS-001", "AIS-002"]
flags.caio = "Ownership moves to the Chief AI Officer"
status_in.annex-iii = "Review required"
status_in.wero = "Review required"
status_in.segments = "Review required"
status_in.model-v5 = "Review required"
status_in.caio = "Owner change"
history = [
  { version = "1.2", date = -126, note = "Review triggers for data sources and model changes added" },
  { version = "1.1", date = -300, note = "Microsoft Copilot added to the scope" },
  { version = "1.0", date = -420, note = "First version, for transaction monitoring" },
]

  [[policies.sections]]
  id = "pol1-scope"
  number = "1"
  title = "Purpose & scope"
  items = [
    { label = "Why we use AI", text = "To strengthen control processes, starting with transaction monitoring in Compliance." },
    { label = "Applies to", text = "Every AI system used in operations. In scope today: Cacsuma-Detect and Microsoft Copilot." },
    { label = "New requests", text = "New uses, such as AI agents in business processes, go through intake and classification before anyone uses them." },
  ]

  [[policies.sections]]
  id = "pol1-class"
  number = "2"
  title = "Risk classification"
  items = [
    { label = "Rule", text = "Every AI system is classified under the EU AI Act before use, and again when a review trigger fires." },
    { label = "Cacsuma-Detect", text = "Minimal risk. Fraud detection is excepted in Annex III point 5(b); the system does not profile customers and is not customer-facing." },
    { label = "Microsoft Copilot", text = "Minimal risk. Internal document search; duties for the underlying general-purpose model sit with Microsoft." },
  ]
  flags.annex-iii = "Cites Annex III point 5(b)"
  flags.segments = "Assumes the system does not profile customers"

  [[policies.sections]]
  id = "pol1-data"
  number = "3"
  title = "Data governance"
  items = [
    { label = "Inputs", text = "SEPA credit transfers (camt.053) from core banking, screened in Cacsuma-Detect." },
    { label = "Name data", text = "Legal name, or first and last name with prefixes. No middle names and no nationality." },
    { label = "Format versions", text = "New camt versions reach all systems with a delay, sometimes months; the versions in use are tracked." },
    { label = "Retention", text = "10 years after the customer relationship ends, or longer where regulation requires." },
  ]
  flags.wero = "New transaction source outside camt.053"
  flags.segments = "New customer data is stored"

  [[policies.sections]]
  id = "pol1-oversight"
  number = "4"
  title = "Human oversight"
  items = [
    { label = "Decisions", text = "No automated reporting: a second compliance officer confirms fraud before it is reported." },
    { label = "Alert handling", text = "From 98 % alerts are escalated automatically, below 85 % closed; 85–98 % are reviewed one by one." },
    { label = "Lists", text = "The AML team maintains the allow and block lists. Hits on allow-listed entities are reviewed after the transaction." },
    { label = "Known gaps", text = "Bulk approve works on every hit, thresholds are vendor defaults, and name matching is not fully understood. Tracked as risks." },
  ]
  flags.model-v5 = "Thresholds are vendor defaults for model 4.2"
  flags.caio = "Controls depend on named owners"

  [[policies.sections]]
  id = "pol1-review"
  number = "5"
  title = "Monitoring & review"
  items = [
    { label = "Triggers", text = "Regulation change, new data source, model change and organisational change start a review." },
    { label = "Scope", text = "A review covers only the parts touched by the change. Tasks are prioritised by the time to the effective date and the number of affected evaluations." },
    { label = "Schedule", text = "A full review once a year." },
  ]
  flags.caio = "Escalation point moves to the Chief AI Officer"

[[policies]]
id = "POL-002"
title = "Compliance manual — transaction monitoring"
kind = "Manual"
owner = "Chief Compliance Officer"
version = "3.4"
status = "In force"
effective = -210
next_review = 155
systems = ["AIS-001"]
flags.caio = "Ownership moves to the Chief AI Officer"
status_in.wero = "Review required"
status_in.segments = "Review required"
status_in.model-v5 = "Review required"
status_in.caio = "Owner change"
history = [
  { version = "3.4", date = -210, note = "Alert thresholds aligned with the Cacsuma-Detect AI module" },
  { version = "3.3", date = -560, note = "Allow and block list procedure added" },
]

  [[policies.sections]]
  id = "pol2-thresholds"
  number = "1"
  title = "Alert thresholds"
  items = [
    { label = "Auto-escalate", text = "Likelihood of 98 % or higher." },
    { label = "Auto-close", text = "Likelihood below 85 %, closed as a false positive." },
    { label = "Manual review", text = "85–98 %, reviewed one by one." },
    { label = "Origin", text = "These are Cacsuma's default values." },
  ]
  flags.model-v5 = "Thresholds must be re-validated for model 5.0"

  [[policies.sections]]
  id = "pol2-review"
  number = "2"
  title = "Alert review & escalation"
  items = [
    { label = "Bulk approve", text = "Analysts can approve any number of alerts in one go." },
    { label = "Fraud", text = "A second officer confirms; confirmed cases are reported to the regulator." },
    { label = "Feedback", text = "Confirmed true and false positives are fed back into Cacsuma-Detect." },
  ]
  flags.segments = "Analysts will see segment and income data"
  flags.caio = "Re-confirm with the new owner"

  [[policies.sections]]
  id = "pol2-screening"
  number = "3"
  title = "Sanctions & PEP screening"
  items = [
    { label = "Team", text = "Handled by the AML team that also reviews transaction alerts." },
    { label = "Allow list", text = "Transactions pass by default; hits are reviewed afterwards." },
    { label = "Block list", text = "Transactions are blocked automatically, whatever the screening result." },
  ]

  [[policies.sections]]
  id = "pol2-rescreen"
  number = "4"
  title = "Rescreening"
  items = [
    { label = "Daily", text = "Screening against the rules that apply that day." },
    { label = "Monthly and quarterly", text = "A full rescreen of the period looks for new patterns that can become rules." },
  ]
  flags.wero = "Wero transactions join the rescreen"

