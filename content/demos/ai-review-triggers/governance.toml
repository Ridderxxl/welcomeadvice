# ---------------------------------------------------------------- Review triggers
# From section 5 of the AI policy. scenarios = which simulated changes fire this trigger.

[[triggers]]
id = "TRG-1"
name = "Regulation change"
fires = "A regulator announces a re-evaluation or a specific change, or a change takes effect."
watches = "Official channels of every regulation in the library"
scope = "Only the answers and passages that cite the changed provision"
owner = "Compliance"
scenarios = ["annex-iii"]

[[triggers]]
id = "TRG-2"
name = "New data source"
fires = "A new data source or data type is connected to an AI system."
watches = "Change requests and data intake forms"
scope = "Data governance, plus classification answers that depend on input data"
owner = "AI system owner"
scenarios = ["wero", "segments"]

[[triggers]]
id = "TRG-3"
name = "Model change"
fires = "A provider announces or deploys a new model version."
watches = "Vendor release notices"
scope = "Model, thresholds, risks and the model review procedure"
owner = "AI system owner and IT"
scenarios = ["model-v5"]

[[triggers]]
id = "TRG-4"
name = "Organisational change"
fires = "Roles or ownership in the compliance structure change."
watches = "Board decisions and HR changes"
scope = "Ownership, approvals, escalation paths and human oversight controls"
owner = "Compliance"
scenarios = ["caio"]
