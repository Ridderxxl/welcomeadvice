  number = "1"
  title = "Vendor model updates"
  items = [
    { label = "Start", text = "Every new model version from Cacsuma starts an impact session with Cacsuma support, IT and Compliance." },
  ]
  flags.model-v5 = "Applies to model 5.0"

  [[policies.sections]]
  id = "pol3-challenger"
  number = "2"
  title = "Challenger run"
  items = [
    { label = "Run", text = "The new model runs next to the current one for at least one month." },
  ]
  flags.model-v5 = "Applies to model 5.0"

  [[policies.sections]]
  id = "pol3-acceptance"
  number = "3"
  title = "Acceptance"
  items = [
    { label = "Test", text = "A simulated yearly review must show that the new model catches at least all previously confirmed true positives." },
  ]
  flags.model-v5 = "Applies to model 5.0"

  [[policies.sections]]
  id = "pol3-feedback"
  number = "4"
  title = "Feedback loop"
  items = [
    { label = "Outcomes", text = "Confirmed true and false positives are shared with Cacsuma-Detect." },
  ]

# ---------------------------------------------------------------- Assessments
# Steps follow the evaluation flow: intake → is it AI → role → risk class →
# risks & measures → review & approval. state: done | current | pending

[[assessments]]
id = "ASM-001"
title = "EU AI Act classification"
template = "EU AI Act classification"
subject = "AIS-001"
status = "Approved"
result = "Minimal risk"
version = "2"
updated = -118
status_in.annex-iii = "Re-assessment required"
status_in.wero = "Partial re-check"
status_in.segments = "Re-assessment required"
status_in.model-v5 = "Partial re-check"
status_in.caio = "Re-approval required"

  [[assessments.steps]]
  id = "a1-intake"
  title = "Intake"
  state = "done"
  questions = [
    { id = "a1-purpose", q = "What is the system used for?", a = "Fraud and AML monitoring", why = "Finds anomalous transactions and screens names against sanctions and PEP lists." },
    { id = "a1-model", q = "Which model and provider?", a = "Cacsuma model 4.2", why = "Delivered by Cacsuma as a module upgrade of Cacsuma-Detect.", flags = { model-v5 = "Provider announced model 5.0" } },
    { id = "a1-data", q = "Which data does it use?", a = "Transactions and names", why = "SEPA credit transfers (camt.053) from core banking; customer names for sanctions and PEP screening.", flags = { wero = "New source: Wero instant payments", segments = "New data: segment, income band, account history" } },
    { id = "a1-users", q = "Who uses the output?", a = "AML analysts", why = "Alerts are reviewed in the Cacsuma-Detect workbench." },
  ]

  [[assessments.steps]]
  id = "a1-ai"
  title = "Is it an AI system?"
  state = "done"
  result = "Yes, under Article 3(1)"
  questions = [
    { id = "a1-infer", q = "Does it infer from its inputs how to generate outputs?", a = "Yes", why = "A trained model scores each transaction; full rescreens add new patterns as rules." },
    { id = "a1-autonomy", q = "Does it work with some level of autonomy?", a = "Yes", why = "Daily screening and alert creation run without manual steps." },
    { id = "a1-influence", q = "Can its outputs influence decisions?", a = "Yes", why = "Alerts drive escalation, closure and reporting." },
  ]

  [[assessments.steps]]
  id = "a1-role"
  title = "Role"
  state = "done"
  result = "Deployer"
  questions = [
    { id = "a1-own-name", q = "Do we put the system into service under our own name?", a = "No", why = "Cacsuma provides it under its own name." },
    { id = "a1-modified", q = "Have we substantially modified it or changed its intended purpose?", a = "No", why = "Used as delivered, for its intended purpose." },
  ]

  [[assessments.steps]]
  id = "a1-class"
  title = "Risk class"
  state = "done"
  result = "Minimal risk"
  questions = [
    { id = "a1-prohibited", q = "Is the use a prohibited practice (Article 5)?", a = "No", why = "No manipulation, social scoring or biometric use." },
    { id = "a1-annex1", q = "Is it a safety component of a product under Annex I?", a = "No", why = "Standalone software." },
    { id = "a1-annex3", q = "Is the use case listed in Annex III?", a = "No, excepted", why = "Annex III point 5(b) excepts AI systems used to detect financial fraud.", flags = { annex-iii = "Cites the amended provision" } },
    { id = "a1-profiling", q = "Does the system profile natural persons?", a = "No", why = "It scores transactions, not customers.", flags = { annex-iii = "The exception may now depend on this answer", segments = "Segment and income data may count as profiling" } },
    { id = "a1-transparency", q = "Do transparency duties apply (Article 50)?", a = "No", why = "Not customer-facing; no generated content is shown to people outside the bank." },
  ]

  [[assessments.steps]]
  id = "a1-risks"
  title = "Risks & measures"
  state = "done"
  result = "4 risks, residual medium or low"
  risks = ["RSK-001", "RSK-002", "RSK-003", "RSK-004"]
  questions = [
    { id = "a1-risk-note", q = "Are the residual risks acceptable?", a = "Yes, with open measures", why = "Bulk approve and name matching stay open until their measures are in place.", flags = { model-v5 = "Risk levels depend on model behaviour" } },
  ]

  [[assessments.steps]]
  id = "a1-approval"
  title = "Review & approval"
  state = "done"
  signoffs = [
    { team = "AI governance", who = "Chief Compliance Officer", decision = "Approved", date = -118, note = "Re-assessed after the AI module upgrade." },
    { team = "Privacy", who = "Data Protection Officer", decision = "Approved", date = -120, note = "No new categories of personal data." },
    { team = "IT security", who = "IT security", decision = "Approved", date = -121, note = "No change to how the system is hosted." },
  ]
  flags.caio = "Approver for AI governance becomes the Chief AI Officer"

